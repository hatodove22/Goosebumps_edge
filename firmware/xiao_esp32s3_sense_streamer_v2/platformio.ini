; Goosebumps Edge AI v2.0 firmware
; Seeed Studio XIAO ESP32S3 Sense with OV3660 camera
; - Wi-Fi JPEG upload via HTTP POST multipart/form-data
; - UDP JSON command listener (LED PWM, start/stop stream, ping, set_param)

[env:xiao_esp32s3_sense_v2]
platform = espressif32@6.7.0
board = seeed_xiao_esp32s3
framework = arduino

; XIAO ESP32S3 Sense has 8MB PSRAM and 8MB flash.
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv

monitor_speed = 115200
upload_speed = 115200

build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    esp32-camera
